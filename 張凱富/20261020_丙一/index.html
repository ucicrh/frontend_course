<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國立科技高中─校園社團介紹網</title>
  <style>
    #main {
      width: 1024px;
      height: 768px;
      margin: auto;
      /* background: lightblue; */
    }

    #top {
      width: 1000px;
      height: 65px;
      margin: auto;
      /* background-color: lightcoral; */
    }

    #left {
      width: 215px;
      /* calc 可以計算 */
      /* +、-、x、/ 左右兩側要半形空白 */
      height: calc(768px - 65px - 20px);
      float: left;
      margin-left: 12px;
      /* background-color: antiquewhite; */
    }

    #menu {
      width: 215px;
      height: calc(768px - 65px - 20px - 25px);
      /* background-color: blueviolet; */
    }

    #menu div {
      font-family: "標楷體";
      font-size: 24px;
      color: #ff00ff;
      font-weight: 500;
      text-decoration: underline;
      text-align: center;
    }

    #menu td {
      width: 215px;
      /* 也可以 35px，根據 menu1.png 的高度，設定 40px 版型會比較好看 */
      height: 40px;
      text-align: center;
      font-family: "標楷體";
      font-size: 16px;
      color: #000;
      background: url("./images/menu1.png") no-repeat center;
    }

    #menu td:hover {
      background: url("./images/menu2.png") no-repeat center;
    }

    /* 這可以不做 */
    #menu a {
      display: block;
      line-height: 40px;
    }

    #update {
      width: 215px;
      height: 25px;
      font-family: "標楷體";
      font-size: 16px;
      color: #000;
      text-align: center;
      /* background-color: blue; */
    }

    #right {
      width: 770px;
      height: calc(768px - 65px - 20px);
      float: right;
      margin-right: 12px;
      /* background: lightgreen; */
    }

    marquee {
      width: 770px;
      height: 29px;
      font-family: "標楷體";
      font-size: 24px;
      color: blue;
      /* 考試可以不寫，處理掉 marquee 下方空白的問題 */
      vertical-align: middle;
    }

    iframe {
      width: 770px;
      height: calc(768px - 65px - 29px - 20px);
      /* background-color: yellow; */
    }

    #footer {
      width: 1000px;
      height: 20px;
      margin: auto;
      clear: both;
      font-family: "標楷體";
      font-size: 16px;
      color: #000;
      text-align: center;
      /* background: red; */
    }
  </style>
</head>

<body>
  <div id="main">
    <div id="top">
      <!-- alt 替代文字，資源連結有錯時顯示的文字 -->
      <!-- tilte 圖片標題文字，滑鼠移上去會顯示的文字 -->
      <a href="./index.html"><img src="./images/logo.png" alt="國立科技高中校園社團介紹網" title="國立科技高中校園社團介紹網"></a>
    </div>
    <div id="left">
      <div id="menu">
        <div>社團介紹</div>
        <!-- table>tr*6>td -->
        <table>
          <tr>
            <td><a href="./guitar_history.html" target="iframe">吉他社</a></td>
          </tr>
          <tr>
            <td>熱舞社</td>
          </tr>
          <tr>
            <td>棒球社</td>
          </tr>
          <tr>
            <td>羽球社</td>
          </tr>
          <tr>
            <td>足球社</td>
          </tr>
          <tr>
            <td>童軍社</td>
          </tr>
        </table>
      </div>
      <div id="update">最近更新日期：2026/11/27</div>
    </div>
    <div id="right">
      <marquee>歡迎光臨校園社團介紹網，參觀後請支持社團活動並熱烈參與</marquee>
      <!-- iframe = content 區 -->
      <iframe src="./main.html" frameborder="0" name="iframe"></iframe>
    </div>
    <div id="footer">網頁設計及維護：00張凱富</div>
  </div>
</body>

</html>
