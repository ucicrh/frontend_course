<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模組 03：超連結與圖片</title>
</head>

<body>
  <h1>超連結、圖片與路徑使用</h1>

  <h2>目錄導覽</h2>
  <ul>
    <li><a href="#links">1.超連結應用</a></li>
    <li><a href="#paths">2.圖片應用</a></li>
    <li><a href="#footer">3.頁尾區域</a></li>
  </ul>

  <h2 id="links">1.超連結應用</h2>
  <h3>外部連結跳轉</h3>
  <p>
    <!-- 絕對路徑，從該文件前往其他網域的位置或者資源 -->
    <!-- 元素可能擁有屬性，是以 attributeName = "value" 顯示，值的習慣用雙引號 -->
    前往 <a href="https://www.google.com">Google</a> <br>
    <!-- target="_blank" 開啟一個新的分頁 -->
    前往 <a href="https://www.google.com" target="_blank">Google</a>
  </p>

  <!-- 相對路徑 ./ 從該文件前往某個目錄的資源(html、css、js、圖片...) -->
  <h3>內部連結跳轉</h3>
  <p>
    <a href="./pages/subpage.html">前往 pages/subpage.html</a>
  </p>
  <p>
    <a href="../02-text-elements/02-text-elements.html">前往 02-text-elements.html</a>
  </p>

  <p>
    <!-- # 表示回頂端 -->
    <a href="#">回頂端</a>
  </p>

  <h2 id="paths">2.圖片應用</h2>
  <!-- 絕對路徑 -->
  <!-- alt 替代文字，當圖片連結失效時出現的文字 -->
  <!-- title 圖片名稱，滑鼠移上圖片顯示 -->
  <!-- width、height 只要設定一個，另一個瀏覽器會自動調整 -->
  <img src="https://ws.wda.gov.tw/Download.ashx?u=LzAwMS9VcGxvYWQvMzA4L2NrZmlsZS8zOGEwYzg3NS0xMDMwLTRkZTUtYWNlYi00MDM4NTU5ZDAwZWEuanBn&n=5rOw5bGx5aC05aSW6KeA56S65oSP5ZyWLmpwZw%3d%3d&icon=.jpg" alt="泰山職訓局大門" title="大門" width="600">
  <!-- 相對路徑 -->
  <img src="./images/dog.jpg" alt="狗狗" title="拉不拉多" width="300">

  <p>
    <!-- # 表示回頂端 -->
    <a href="#">回頂端</a>
  </p>

  <hr>

  <h2>使用 iframe 嵌入頁面</h2>
  <h3>Google 地圖</h3>
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3614.7036499805677!2d121.41694067537684!3d25.04412927780987!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442a7bec9ad74b1%3A0xa639904a89f26435!2z5Yue5YuV6YOo5Yue5YuV5Yqb55m85bGV572y5YyX5Z-65a6c6Iqx6YeR6aas5YiG572y5rOw5bGx6IG35qWt6KiT57e05aC0!5e0!3m2!1szh-TW!2stw!4v1790658659427!5m2!1szh-TW!2stw" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <iframe width="560" height="315" src="https://www.youtube.com/embed/gd27kvHGbok?si=T0nyqovifS0O74_u" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  <h3>載入頁面到指定 iframe</h3>
  <!-- 預設頁是 subpage.html -->
  <!-- frameborder 外框顯示 -->
  <a href="./pages/news.html" target="myframe">將 news.html 嵌入到一個名稱叫 myframe 的 iframe</a>
  <br>
  <iframe src="./pages/subpage.html" frameborder="1" width="800" height="300" name="myframe"></iframe>

  <hr>

  <h2 id="footer">3.頁尾區域</h2>
  <p>
    <!-- # 表示回頂端 -->
    <a href="#">回頂端</a>
  </p>
  <hr>

  </p>
</body>

</html>
