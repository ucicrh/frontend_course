<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表單</title>
</head>

<body>
  <h1>註冊表單</h1>

  <form>
    <fieldset>
      <legend>基本帳號資訊</legend>
      <p>
        <!-- label 的 for 屬性值必須完全對應 input 的 id 值 -->
        <label for="username">使用者帳號（必填）：</label>
        <!-- type 有很多種類，text 是文字欄位 -->
        <!-- placeholder 佔位文字 -->
        <!-- required 欄位是必填 -->
        <!-- size 寬度、maxlength 最大字元數 -->
        <input id="username" type="text" placeholder="請輸入 6-12 英文或數字" size="30" maxlength="12" name="username" required>
      </p>
      <p>
        <label for="password">設定密碼（必填）：</label>
        <input id="password" type="password" placeholder="請輸入密碼" name="password" required>
      </p>
      <p>
        <label for="email">電子信箱（必填）：</label>
        <input id="email" type="email" placeholder="example@email.com" name="email" required>
      </p>
      <p>
        <label for="age">年齡：</label>
        <!-- number 可以限制最小、最大以及預設值 -->
        <input id="age" type="number" name="age" min="12" max="100" value="18">
      </p>
      <p>
        <label for="birthday">生日：</label>
        <input id="birthday" type="date" name="birthday">
      </p>
    </fieldset>

    <br>

    <fieldset>
      <legend>個人偏好與興趣</legend>
      <p>性別：</p>
      <p>
        <!-- 單選用 radio、複選用 checkbox -->
        <!-- name 的值要相同表示同一組 -->
        <input id="female" type="radio" name="gender" value="female" checked>
        <label for="female">女性</label>
        <input id="male" type="radio" name="gender" value="male">
        <label for="male">男性</label>
      </p>
      <p>興趣：</p>
      <p>
        <!-- name 的值要相同表示同一組 -->
        <input id="hobby-swimming" type="checkbox" name="hobby" value="swimming">
        <label for="hobby-swimming">游泳</label>
        <input id="hobby-baseball" type="checkbox" name="hobby" value="baseball">
        <label for="hobby-baseball">棒球</label>
        <input id="hobby-basketball" type="checkbox" name="hobby" value="basketball">
        <label for="hobby-basketball">游泳</label>
      </p>

      <p>
        <label for="city">居住城市：</label>
        <select id="city" name="city">
          <option value="">--請選擇居住縣市--</option>
          <option value="taipei">台北市</option>
          <option value="new-taipei">新北市</option>
          <option value="taichung">台中市</option>
          <option value="kaohsiung">高雄市</option>
        </select>
      </p>

      <p>
        <label for="bio">自我介紹：</label>
        <!-- 多行文字輸入 -->
        <textarea id="bio" name="bio" rows="15" cols="100" placeholder="請自我介紹..."></textarea>
      </p>
    </fieldset>

    <p>
      <input type="submit" value="送出">
      <input type="reset" value="重填">
    </p>
  </form>

  <p>
    <a href="./04-table.html">上一單元：表格</a>
  </p>
</body>

</html>
