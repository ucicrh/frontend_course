<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國家公園介紹網</title>
  <style>
    #main {
      width: 1024px;
      height: 768px;
      margin: auto;
      /* background: lightblue; */
    }

    #top {
      width: 1000px;
      height: 65px;
      margin: auto;
      text-align: center;
      background: #0000FF;
    }

    #left {
      width: 200px;
      height: calc(768px - 65px - 20px);
      margin-left: 12px;
      float: left;
      background: #00FFFF;
    }

    #left table {
      width: 100%;
      text-align: center;
    }

    #left img {
      width: 120px;
      height: 40px;
    }

    #left img:hover {
      /* 色相旋轉 120deg */
      filter: hue-rotate(120deg);
    }

    .download {
      text-align: center;
    }

    #right {
      width: 800px;
      height: calc(768px - 65px - 20px);
      margin-right: 12px;
      float: right;
      /* background: lightseagreen; */
    }

    marquee {
      width: 800px;
      height: 29px;
      /* 不算分數，會取消 marquee 底部空白 */
      vertical-align: middle;
    }

    iframe {
      width: 800px;
      height: calc(768px - 65px - 20px - 29px);
    }

    #footer {
      width: 1000px;
      height: 20px;
      margin: auto;
      /* 清除浮動，沒有這區塊會跑到上面被左、右遮蓋 */
      clear: both;
      font-size: 16px;
      font-family: "標楷體";
      text-align: center;
      color: #000;
      /* background: lightpink; */
    }
  </style>
</head>

<body>
  <div id="main">
    <div id="top">
      <a href="./index.html"><img src="./images/park0307.gif"></a>
    </div>
    <div id="left">
      <!-- table>tr*7>td -->
      <table>
        <!-- 一 -->
        <tr>
          <td>
            <a href="./park/yangmingshan.html" target="iframe">
              <img src="./images/park0302.jpg" alt="陽明山國家公園" title="陽明山國家公園">
            </a>
          </td>
        </tr>
        <tr>
          <td><br></td>
        </tr>
        <!-- 三 -->
        <tr>
          <td>
            <a href="./park/sheipa.html" target="iframe">
              <img src="./images/park0303.jpg" alt="雪霸國家公園" title="雪霸國家公園">
            </a>
          </td>
        </tr>
        <tr>
          <td><br></td>
        </tr>
        <!-- 五 -->
        <tr>
          <td>
            <img src="./images/park0304.jpg" alt="太魯閣國家公園" title="太魯閣國家公園">
          </td>
        </tr>
        <tr>
          <td><br></td>
        </tr>
        <!-- 七 -->
        <tr>
          <td>
            <img src="./images/park0305.jpg" alt="玉山國家公園" title="玉山國家公園">
          </td>
        </tr>
      </table>
      <!-- 加上屬性 download 可以下載（但是要在 http://localhost 測試） -->
      <p class="download"><a href="./others/park.mp3" download>檔案下載</a></p>
    </div>
    <div id="right">
      <marquee>歡迎進入國家公園介紹網，本網站有詳細的國家公園介紹哦！</marquee>
      <iframe src="./others/main.html" frameborder="0" name="iframe"></iframe>
    </div>
    <div id="footer">
      網頁設計及維護：00張凱富、最近更新日期：2026/11/27
    </div>
  </div>
</body>

</html>
