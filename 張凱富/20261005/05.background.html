<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05.background</title>
  <style>
    body {
      background-image: url("https://picsum.photos/1920/1080/?random=1");
      background-repeat: no-repeat;
      /* 將背景固定在視窗上，不隨滾動而移動 */
      background-attachment: fixed;
      background-size: cover;
    }

    /* 畫一個盒子 */
    .box {
      width: 600px;
      height: 400px;
      border: 5px solid #333;
      margin: 40px auto;
      font-size: 2rem;
      color: yellow;
      text-shadow: 1px 1px 3px #000;
      background-color: rgba(0, 0, 0, 0.4);
      /* 讓盒子下方的背景有模糊效果 */
      backdrop-filter: blur(5px);
    }

    /* 垂直與水平居中 */
    .vh-center {
      text-align: center;
      line-height: 400px;
    }

    /* 背景顏色 */
    .bg-color {
      background-color: lightpink;
    }

    /* 背景圖片 */
    .bg-img {
      background-image: url('./pikachu.png');
    }

    .bg-size-200px {
      background-size: 200px;
    }

    /* 水平平舖 */
    .bg-repeat-x {
      background-repeat: repeat-x;
    }

    /* 垂直平舖 */
    .bg-repeat-y {
      background-repeat: repeat-y;
    }

    .bg-no-repeat {
      background-repeat: no-repeat;
    }

    .bg-size-contain {
      background-size: contain;
    }

    .bg-size-cover {
      background-size: cover;
    }

    .bg-size-custom {
      /* 設定皮卡丘的背景尺寸大小 */
      background-size: 200px 300px;
      background-size: 50% 50%;
      background-size: 300px 200px;
    }

    .bg-position {
      /* 雙值: 水平位置 垂直位置 */
      /* 水平的值 left、center、right */
      /* 垂直的值 top、center、bottom */
      background-position: center center;
      background-position: top;
      background-position: right;
      background-position: bottom;
      background-position: left;
      /* 也可以用 px、%、em、rem ... */
      background-position: 100px 50px;
    }

    .bg-shorthand {
      /* background-size 前面必須加上斜線 /，且必須緊接在 background-position 之後 */
      /* background-color、background-image、background-repeat、background-position/background-size */
      background: lightgoldenrodyellow url("./pikachu.png") no-repeat center center/cover;
    }

    .multi-bg {
      background-color: lightcyan;
      background-image: url('./pikachu.png'), url('./pikachu.png'), url('./pikachu.png');
      background-repeat: no-repeat, no-repeat, no-repeat;
      background-size: 100px 100px, 120px 120px, 150px 150px;
      background-position: left top, right top, center center;
    }

    .liear-gradient {
      /* 漸層是背景圖(background-image)的一種 */
      /* 預設是從上到下，180deg */
      background-image: linear-gradient(red, yellow, white);
      /* 用 to left、to right、to top、to bottom 設定漸層方向*/
      background-image: linear-gradient(to left, red, yellow, white);
      /* 用 degrees 角度設定漸層方向 */
      background-image: linear-gradient(45deg, red, yellow, white);
      /* 漸層的站點的百分比 */
      background-image: linear-gradient(to right, red 0%, orange 25%, yellow 50%, green 75%, blue 100%);
      background-image: linear-gradient(to right, black 50%, white 50%);
    }
  </style>
</head>

<body>
  <div class="box bg-color vh-center">1.background-color</div>
  <!-- 背景預設是平舖，由左至右、由上至下 -->
  <div class="box bg-img bg-size-200px vh-center">2.background-image</div>
  <div class="box bg-img bg-size-200px bg-repeat-x vh-center">3.水平平舖</div>
  <div class="box bg-img bg-size-200px bg-repeat-y vh-center">4.垂直平舖</div>
  <div class="box bg-img bg-size-200px bg-no-repeat vh-center">5.不平舖</div>
  <div class="box bg-img bg-no-repeat vh-center bg-size-contain">6.background-size:contain</div>
  <div class="box bg-img bg-no-repeat vh-center bg-size-cover">7.background-size:cover</div>
  <div class="box bg-img bg-no-repeat vh-center bg-size-custom">8.background-size:custom</div>
  <div class="box bg-img bg-no-repeat vh-center bg-size-200px bg-position">9.background-position</div>
  <div class="box bg-shorthand">縮寫</div>
  <div class="box multi-bg"></div>
  <div class="box liear-gradient"></div>

</body>

</html>
