<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>homework_syringe</title>
  <style>
    *{
      box-sizing: border-box;
    }
    div.body{
      width: 400px;
      height: 80px;
      background-image: linear-gradient(90deg, #FFF 45%, #000 45%, #000 55%, #FDFDA9 55%, #FDFDA9 100% );
      border: 1px solid #BBB;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    div.body::before{
      content: "";
      width: 45px;
      height: 60px;
      border: 1px solid #BBB;
      background-image: linear-gradient(transparent 0%, #00000030 50%, transparent 100%);
      position: absolute;
      top: 10px;
      left: -47px;
    }
    div.body::after{
      content: "";
      width: 45px;
      height: 60px;
      border: 1px solid #BBB;
      background-image: linear-gradient(transparent 0%, #00000030 50%, transparent 100%);
      position: absolute;
      top: 10px;
      right: -47px;
      border-radius: 0 5px 5px 0;
    }
    div.body div.inside{
      width: 100%;
      height: 100%;
      background-image: linear-gradient(transparent 0%, #00000030 50%, transparent 100%);
    }
    div.body div.inside div.text{
      font-family: Arial, Helvetica, sans-serif;
      color: #BBB;
      width: 100%;
      height: 100%;
      padding: 5px;
      line-height: 125px;
      position: relative;
      overflow: hidden;
    }
    div.body div.inside::before{
      content: "";
      width: 30px;
      height: 80px;
      border: 1px solid #BBB;
      background-image: linear-gradient(transparent 0%, #00000030 50%, transparent 100%);
      position: absolute;
      top: 0;
      left: -78px;
      border-radius: 5px;
    }
    div.body div.inside::after{
      content: "";
      width: 80px;
      height: 2px;
      background-color: #AAA;
      position: absolute;
      right: -127px;
      top: 50%;
      transform: translateY(-50%);
    }
    div.body div.inside div.text::before{
      content: " | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | | |";
      width: 100%;
      height: 100%;
      position: absolute;
      top: -75%;
      left: 3px;
    }
    div.body div.inside div.text::after{
      content: "";
      width: 100%;
      height: 100%;
      background-image: linear-gradient(90deg, transparent 45%, #000 45%, #000 55%, transparent 55%, transparent 100% );
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="body">
    <div class="inside">
      <div class="text">
        Made in Taiwan 
      </div>
    </div>
  </div>  
</body>
</html>
