<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 400px;
            height: 100px;
            border: 1px solid black;
            /* background: linear-gradient(to right, rgba(248, 247, 246, 0.997) 0% 45%, black 45% 55%, rgb(235, 238, 168) 55% 100%); */

            background: linear-gradient(to bottom, rgba(128, 128, 128, 0) 0%, rgba(128, 128, 128, 0.3) 50%, rgba(128, 128, 128, 0) 100%),
                linear-gradient(to right, rgba(248, 247, 246, 0.997) 0% 45%, black 45% 55%, rgb(235, 238, 168) 55% 100%);

            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 19px;
            background: repeating-linear-gradient(to right,
                    black 0,
                    black 1px,
                    transparent 1px,
                    transparent 15px);
        }

        .box::after {
            content: "";
            width: 50px;
            height: 70px;
            border: 1px solid black;
            border-radius: 0 15% 15% 0;
            background: linear-gradient(to bottom, rgba(128, 128, 128, 0) 0%, rgba(128, 128, 128, 0.3) 50%, rgba(128, 128, 128, 0) 100%);

            position: absolute;
            right: -52px;
            top: 50%;
            transform: translateY(-50%);
        }

        div {
            display: flex;
            /* 水平 */
            justify-content: flex-start;
            /* 垂直 */
            align-items: flex-end;

            font-size: 10px;
            color: gray;
        }

        .box1 {
            width: 400px;
            height: 100px;
            border: 1px solid black;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .box1::before {
            content: "";
            width: 81px;
            height: 0px;
            border: 1px solid black;
            border-left: none;

            position: absolute;
            right: -133px;
            top: 50%;
            transform: translateY(-50%);
        }

        .box1::after {
            content: "";
            width: 50px;
            height: 70px;
            border: 1px solid black;
            background: linear-gradient(to bottom, rgba(128, 128, 128, 0) 0%, rgba(128, 128, 128, 0.3) 50%, rgba(128, 128, 128, 0) 100%);

            position: absolute;
            right: 400px;
            top: 50%;
            transform: translateY(-50%);
        }

        .box2 {
            width: 400px;
            height: 100px;
            border: 1px solid black;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .box2::before {
            content: "";
            width: 50px;
            height: 100px;
            border: 1px solid black;
            border-radius: 15% 15% 15% 15%;
            background: linear-gradient(to bottom, rgba(128, 128, 128, 0) 0%, rgba(128, 128, 128, 0.3) 50%, rgba(128, 128, 128, 0) 100%);

            position: absolute;
            right: 451px;
            top: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>

<body>
    <div class="box2">
        <div class="box1">
            <div class="box">Made in Taiwan</div>
        </div>
    </div>
</body>

</html>
