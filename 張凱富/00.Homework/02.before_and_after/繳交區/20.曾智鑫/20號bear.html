<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 300px;
            height: 300px;
            background: black;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            top: 50%;
            left: 50%;
            position: absolute;

        }

        .box::after {
            content: "";
            width: 65px;
            height: 65px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            top: 30%;
            left: 30%;
            position: absolute;

        }

        .box::before {
            content: "";
            width: 65px;
            height: 65px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            top: 30%;
            right: 10%;
            position: absolute;
        }

        .ear1 {
            width: 130px;
            height: 90px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            top: 55%;
            left: 50%;

            position: absolute;
        }

        .ear1::before {
            content: "";
            width: 50px;
            height: 50px;
            background: black;
            border-radius: 50%;
            /* transform: translate(-50%,-100% ); */
            position: absolute;
            top: -130%;
            left: -50%;

        }

        .ear1::after {
            content: "";
            width: 50px;
            height: 50px;
            background: black;
            border-radius: 50%;
            /* transform: translate(-50%, -50%); */
            position: absolute;
            top: -130%;
            left: 100%;

        }

        .ear2 {
            width: 30px;
            height: 20px;
            background: black;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            top: 45%;
            left: 50%;

            position: absolute;
        }

        .ear2::before {
            content: "";
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            /* transform: translate(-50%,-50% ); */
            position: absolute;
            top: -580%;
            left: -365%;

        }

        .ear2::after {
            content: "";
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            /* transform: translate(-50%, -50%); */
            position: absolute;
            top: -580%;
            left: 290%;
            z-index: 1;
        }

        .eye1 {
            width: 70px;
            height: 30px;
            background: black;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            top: 58%;
            left: 50%;
            z-index: 1;
            position: absolute;
        }

        .eye1::before {
            content: "";
            width: 50px;
            height: 50px;
            background: black;
            border-radius: 50%;
            /* transform: translate(-250%,-50% ); */
            position: absolute;
            top: -306%;
            left: -68%;

        }

        .eye1::after {
            content: "";
            width: 50px;
            height: 50px;
            background: black;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
            top: -230%;
            left: 130%;

        }

        .eye2 {
            width: 70px;
            height: 30px;
            background: black;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            top: 58%;
            left: 50%;
            z-index: 1;
            position: absolute;
        }

        .eye2::before {
            content: "";
            width: 70px;
            height: 70px;
            background: red;
            border-radius: 50%;
            /* transform: translate(-250%,-50% ); */
            position: absolute;
            top: -100%;
            left: -200%;

        }

        .eye2::after {
            content: "";
            width: 70px;
            height: 70px;
            background: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
            top: 25%;
            left: 250%;

        }

        .w {
            width: 70px;
            height: 30px;
            background: black;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            top: 58%;
            left: 50%;
            z-index: 1;
            position: absolute;
        }

        .w::before {
            content: "";
            width: 40px;
            height: 40px;
            background: white;
            transform: skew(45deg, 0deg);
            /* transform: translate(-250%,-50% ); */
            position: absolute;
            top: 250%;
            left: -20%;

        }

        .w::after {
            content: "";
            width: 40px;
            height: 40px;
            background: white;
            transform: skew(-45deg, 0deg);

            /* transform: translate(-50%, -50%); */
            position: absolute;
            top: 250%;
            right: -20%;

        }
    </style>


</head>

<body>
    <div class="box">
        <div class="ear1"></div>
        <div class="ear2"></div>
        <div class="eye1"></div>
        <div class="eye2"></div>
        <div class="w"></div>
    </div>
</body>

</html>
