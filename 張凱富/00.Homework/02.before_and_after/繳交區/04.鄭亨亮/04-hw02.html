<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04hw02</title>
    <style>
        /* 1. 針筒 */
        .sy {
            width: 250px;
            height: 60px;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: linear-gradient(to bottom, #eeeeee 0%, #ffffff 40%, #cccccc 100%);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .sy ul {
            margin: 0;
            /* 清除預設上下邊距 */
            padding: 0;
            /* 清除預設左側內邊距 (40px) */
            position: absolute;
            /* 相對於針筒定位 */
            top: 0;
            /* 緊貼最上方 */
            left: 0;
            width: 100%;
            z-index: 4;
            /* 確保層級高於藥劑 (.liq) 與活塞 (.pis) */
        }

        /* 刻度線條 */
        .sy li {
            float: left;
            box-sizing: border-border-box;
            list-style: none;
            border-left: 1px solid #888888;
            /* 建議改為灰色，看起來更精細 */
            display: block;
            width: 10px;
            height: 12px;
            /* 調整適合的刻度高度 */
        }



        /* 標籤文字  */
        .sy::after {
            content: "Made in Taiwan";
            position: absolute;
            bottom: 3px;
            left: 10px;
            font-size: 11px;
            color: #888888;
            z-index: 4;
        }

        /* 2. 推桿 */
        .plu {
            position: absolute;
            left: -50px;
            width: 50px;
            height: 36px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(to bottom, #e0e0e0, #ffffff, #b0b0b0);
            border: 1px solid #aaa;
            border-right: none;
        }

        /* 押頭 */
        .plu::before {
            content: "";
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 58px;
            background: linear-gradient(to bottom, #e0e0e0, #ffffff, #b0b0b0);
            border: 1px solid #aaa;

        }

        /* 3. 塞頭 */
        .pis {
            position: absolute;
            left: 115px;
            width: 25px;
            height: 100%;
            background-color: #000000;
            z-index: 2;
        }

        /* 4. 藥 */
        .liq {
            position: absolute;
            right: 0;
            width: 110px;
            height: 100%;
            background: linear-gradient(to bottom, #f7f3a8 0%, #e8e178 50%, #c2ba42 100%);
            border-radius: 0 3px 3px 0;
            z-index: 1;
        }

        /* 5. 針頭 */
        .need {
            position: absolute;
            right: -25px;
            width: 25px;
            height: 36px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(to bottom, #e0e0e0, #ffffff, #b0b0b0);
            border: 1px solid #aaa;

        }

        /* 針 */
        .need::before {
            content: "";
            position: absolute;
            right: -55px;
            width: 55px;
            height: 1.5px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #555555;

        }
    </style>
</head>

<body>
    <div class="sy">
        <ul>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
        </ul>

        <div class="plu"></div>
        <div class="pis"></div>
        <div class="liq"></div>
        <div class="need"></div>
    </div>

</body>

</html>
