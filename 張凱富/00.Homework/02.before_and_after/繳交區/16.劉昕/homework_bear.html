<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .face {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: black;
            border-radius: 50%;
        }

        .face::before {
            content: "";
            background: red;
            border-radius: 50%;
            height: 25%;
            width: 25%;
            position: absolute;
            top: 0;
            left: -5%;
            bottom: 0;
            margin: auto;
        }

        .face::after {
            content: "";
            background: red;
            border-radius: 50%;
            height: 25%;
            width: 25%;
            position: absolute;
            top: 0;
            right: -5%;
            bottom: 0;
            margin: auto;
        }

        .ears {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
        }

        .ears::before {
            content: "";
            background: radial-gradient(circle, white 0%,
                    white 45%,
                    black 45%,
                    black 100%);
            border-radius: 50%;
            height: 15%;
            width: 15%;
            position: absolute;
            top: 2%;
            left: 10%;
        }

        .ears::after {
            content: "";
            background: radial-gradient(circle, white 0%,
                    white 45%,
                    black 45%,
                    black 100%);
            border-radius: 50%;
            height: 15%;
            width: 15%;
            position: absolute;
            top: 2%;
            right: 10%;
        }

        .eyes {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
        }

        .eyes::before {
            content: "";
            background: radial-gradient(circle, black 0%,
                    black 45%,
                    white 45%,
                    white 100%);
            border-radius: 50%;
            height: 20%;
            width: 20%;
            position: absolute;
            top: 20%;
            left: 20%;
        }

        .eyes::after {
            content: "";
            background: radial-gradient(circle, black 0%,
                    black 45%,
                    white 45%,
                    white 100%);
            border-radius: 50%;
            height: 20%;
            width: 20%;
            position: absolute;
            top: 20%;
            right: 20%;
        }

        .mouth {
            position: absolute;
            width: 45%;
            height: 30%;
            border-radius: 50%;
            background: white;
            top: 38%;
            left: 0;
            right: 0;
            margin: auto;
        }

        .mouth::before {
            content: "";
            width: 25%;
            height: 22%;
            border-radius: 50%;
            background: black;
            position: absolute;
            top: 8%;
            left: 0;
            right: 0;
            margin: auto;
        }

        .mouth::after {
            content: "";
            width: 65%;
            height: 35%;
            border-radius: 50%;
            background: black;
            position: absolute;
            bottom: 20%;
            left: 0;
            right: 0;
            margin: auto;
        }

        .skew::before {
            content: "";
            width: 13%;
            height: 13%;
            background: white;
            position: absolute;
            left: 0;
            right: 15%;
            bottom: 10%;
            margin: auto;
            transform: skew(50deg, 0deg);
        }

        .skew::after {
            content: "";
            width: 13%;
            height: 13%;
            background: white;
            position: absolute;
            left: 15%;
            right: 0;
            bottom: 10%;
            margin: auto;
            transform: skew(-50deg, 0deg);
        }
    </style>
</head>

<body>
    <div class="face">
        <div class="ears"></div>
        <div class="eyes"></div>
        <div class="mouth"></div>
        <div class="skew"></div>
    </div>
</body>

</html>
