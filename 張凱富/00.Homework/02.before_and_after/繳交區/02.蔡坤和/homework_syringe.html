<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>syringe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    /* 整支針筒 */
    .syringe {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 865px;
      height: 137px;
    }

    /* 推桿 */
    .plunger {
      position: absolute;
      left: 57px;
      top: 50%;
      transform: translateY(-50%);
      width: 695px;
      height: 94px;
      border: 1px solid #bbb;
      border-radius: 0 9px 9px 0;
      border: 1px solid #aaa;
      background: linear-gradient(to bottom, #fff, #ddd 55%, #fff);
    }

    .plunger::before {
      content: "";
      position: absolute;
      left: -57px;
      top: 50%;
      transform: translateY(-50%);
      width: 57px;
      height: 136px;
      border: 1px solid #bbb;
      border-radius: 12px 7px 7px 12px;
      background: linear-gradient(to bottom,
          #fff 0%,
          #eee 35%,
          #ccc 60%,
          #fdfdfd 100%);
      z-index: 2;
    }

    /* 針頭 */
    .plunger::after {
      content: "";
      position: absolute;
      right: -114px;
      top: 50%;
      transform: translateY(-50%);
      width: 114px;
      height: 1.5px;
      background: #777;
      transform: rotate(0deg);
    }

    /* 針筒主體 */
    .barrel {
      position: absolute;
      left: 120px;
      top: 50%;
      transform: translateY(-50%);
      width: 563px;
      height: 138px;
      border: 1px solid #aaa;
      background: linear-gradient(to bottom,
          #fff 0%,
          #f8f8f8 25%,
          #ccc 60%,
          #fdfdfd 100%);
    }

    /* 右側黃色液體 */
    .barrel::before {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: 309px;
      height: 136px;
      background: linear-gradient(to right,
          #000 0,
          #000 57px,
          rgba(255, 255, 153, 0.5) 57px,
          rgba(255, 255, 153, 0.5) 252px);
    }

    /* 刻度線 */
    .barrel::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 563px;
      height: 20px;
      background: repeating-linear-gradient(to right,
          transparent 0,
          transparent 18px,
          rgba(0, 0, 0, 0.3) 18px,
          rgba(0, 0, 0, 0.3) 19px);
    }

    /* Made in Taiwan */
    .label {
      position: absolute;
      left: 0;
      top: 112px;
      color: #aaa;
      font:
        18px Arial,
        sans-serif;
    }
  </style>
</head>

<body>
  <div class="syringe">
    <div class="plunger"></div>
    <div class="barrel">
      <div class="label">Made in Taiwan</div>
    </div>
  </div>
</body>

</html>
