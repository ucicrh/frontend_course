<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 拿 main.html 來用，但記得加上背景 */
    table {
      margin: auto;
      text-align: center;
      border-collapse: collapse;
      background: #ff9;
    }

    td {
      border: 1px solid #333;
      width: 400px;
    }

    tr:nth-child(odd) {
      height: 100px;
    }

    tr:nth-child(even) {
      height: 150px;
    }

    img {
      height: 150px;
      vertical-align: middle;
    }

    p {
      /* 讓送出、重置按鈕水平置中 */
      text-align: center;
    }
  </style>
</head>

<body>
  <form>
    <table>
      <tr>
        <td>真皮皮包</td>
        <td>真皮短夾</td>
      </tr>
      <tr>
        <td><img src="../images/0403.jpg"></td>
        <td><img src="../images/0404.jpg"></td>
      </tr>
      <tr>
        <td>
          <!-- name 要相同，value 給程式抓取用 -->
          <input type="radio" name="r1" value="購買" checked>購買
          <input type="radio" name="r1" value="不購買">不購買
          <input type="radio" name="r1" value="考慮中">考慮中
        </td>
        <td>
          <input type="radio" name="r2" value="購買">購買
          <input type="radio" name="r2" value="不購買">不購買
          <input type="radio" name="r2" value="考慮中" checked>考慮中
        </td>
      </tr>
    </table>
    <p>
      <input type="submit" value="送出" onclick="showMsg(form.r1.value, form.r2.value)">
      <input type="reset" value="重置">
    </p>
  </form>

  <script>
    // ctrl+alt+, 可以叫出 符號查詢 插入 ●
    // 或是滑鼠移到視窗右下角的中英輸入法按右鍵 > 符號查詢 > 插入 ●
    function showMsg(v1, v2) {
      alert(`
      流行皮件選購確認：

      ●真皮皮包：${v1}
      ●真皮短夾：${v2}
      `)
    }

  </script>
</body>

</html>
