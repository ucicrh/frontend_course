<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #div {
      width: 300px;
      height: 300px;
      background: gray;
    }
    #out {
      width: 300px;
      height: 300px;
      background: gray;
    }
    #in {
      width: 100px;
      height: 100px;
      background: black;
    }
  </style>
</head>
<body>
  <div id="div"></div>
  <p id="key"></p>
  <a href="https://google.com" id="link">Google</a>
  <form action="" id="form">
    <input type="text" name="account">
    <input type="text" name="password">
    <input type="submit" value="送出">
  </form>
  <div id="out">
    <div id="in"></div>
  </div>
  <script>
    const div = document.getElementById('div')
    div.onclick = (event) => {
      console.log(event)
    }

    const key = document.getElementById('key')
    document.onkeydown = event => {
      console.log(event)
      key.innerText = event.key.toUpperCase()
    }

    const link = document.getElementById('link')
    link.onclick = event => {
      event.preventDefault()
    }

    const form = document.getElementById('form')
    form.onsubmit = event => {
      event.preventDefault()
    }

    const divOut = document.getElementById('out')
    const divIn = document.getElementById('in')
    // divOut.onclick = () => {
    //   console.log('out')
    // }
    // divIn.onclick = event => {
    //   console.log('in')
    //   event.stopPropagation()
    // }
    divOut.addEventListener('click', () => {
      console.log('out 捕獲')
    }, true)
    divOut.addEventListener('click', () => {
      console.log('out 冒泡')
    }, false)

    divIn.addEventListener('click', () => {
      console.log('in 捕獲')
    }, true)
    divIn.addEventListener('click', event => {
      console.log('in 冒泡')
      // event.stopPropagation()
    }, false)
  </script>
</body>
</html>
