<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    var a = 1
    {
      var a = 2
      console.log(a)    // 2
    }
    console.log(a)      // 2

    let b = 1
    {
      let b = 2
      console.log(b)    // 2
    }
    console.log(b)      // 1

    let c = 1
    {
      c = 2
      console.log(c)    // 2
    }
    console.log(c)      // 2
  </script>
</body>
</html>
