<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const dinner = prompt('晚餐吃什麼?')
    if (dinner === '牛排' || dinner === '披薩') {
      document.write('<p>晚餐好耶</p>')
    } else {
      document.write('<p>晚餐不好耶</p>')
    }

    // confirm(顯示文字)
    // 跳出確認對話框，確認 = true，取消 = false
    const rain = confirm('下雨?')
    const thunder = confirm('打雷?')
    if (!rain && !thunder) {
      document.write('<p>今天天氣好</p>')
    } else {
      document.write('<p>今天天氣不好</p>')
    }
  </script>
</body>
</html>
