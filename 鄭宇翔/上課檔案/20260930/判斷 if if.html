<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const rain = confirm('雨')
    const umbrella = confirm('傘')

    if (rain) {
      if (umbrella) {
        document.write('下雨天有傘，沒事')
      } else {
        document.write('下雨天沒傘，淋雨')
      }
    } else {
      document.write('沒有下雨')
    }
  </script>
</body>
</html>
