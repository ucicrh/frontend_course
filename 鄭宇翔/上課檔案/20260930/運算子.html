<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let a = 5
    // 單純計算，不會修改到 a
    a + 10
    console.log(a)    // 5
    // 有 = 才是修改
    a = a + 10
    console.log(a)    // 15
    // 指派運算子簡寫
    a += 10
    console.log(a)    // 25
  </script>
</body>
</html>
