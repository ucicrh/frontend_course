<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // 1 + 2 + 3 + ... + n
    // n = 5
    // sum(5) = 5 + sum(5 - 1) = 5 + sum(4) = 5 + 10 = 15
    // sum(4) = 4 + sum(4 - 1) = 4 + sum(3) = 4 + 6 = 10
    // sum(3) = 3 + sum(3 - 1) = 3 + sum(2) = 3 + 3 = 6
    // sum(2) = 2 + sum(2 - 1) = 2 + sum(1) = 2 + 1 = 3
    // sum(1) = 1
    const sum = n => {
      if (n === 1) {
        return 1
      } else {
        return n + sum(n - 1)
      }
    }
    document.write(sum(5) + '<br>')

    // 輾轉相除法
    // gcd(2002, 847) => 2002 % 847 = 308 => gcd(847, 308)
    // gcd(847, 308) => 847 % 308 = 231 => gcd(308, 231)
    // gcd(308, 231) => 308 % 231 = 77 => gcd(231, 77)
    // gcd(231, 77) => 231 % 77 = 0 => 77
    const gcd = (a, b) => {
      if (a % b === 0) {
        return b
      } else {
        return gcd(b, a % b)
      }
    }
  </script>
</body>
</html>
