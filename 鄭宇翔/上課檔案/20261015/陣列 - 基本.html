<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const fruits = ['蘋果', '西瓜', '香蕉']
    
    // forEach(function)
    // 陣列每個東西都執行提供的 function
    // 三個參數按照順序是值、索引、陣列本身
    fruits.forEach((value, index, array) => {
      console.log(value, index, array)
    })

    // .push 新增到後面
    fruits.push('草莓')
    console.log(fruits)
    fruits.push('橘子', '芭樂')
    console.log(fruits)

    const otherFruits = ['葡萄', '柿子']
    fruits.push(...otherFruits)
    console.log(fruits)

    // .unshift 新增到前面
    fruits.unshift('櫻桃')

    // .pop 移除最後一個並回傳
    const last = fruits.pop()
    console.log(last, fruits)

    // .shift 移除第一個並回傳
    const first = fruits.shift()
    console.log(first, fruits)

    // .splice(索引, 刪除數量, 插入內容...)
    fruits.splice(1, 2, '榴槤', '火龍果')
    console.log(fruits)

    // .slice
    // 將結果變成新的陣列，不會動到原本的
    const slice = fruits.slice(0, 3)
    console.log(slice, fruits)

    // .toReversed 產生顛倒的新陣列
    // .reverse    直接將原本陣列顛倒
    const reverse = fruits.toReversed()
    console.log(reverse, fruits)

    // .join(連結文字)
    document.write(fruits.join('-'))
  </script>
</body>
</html>
