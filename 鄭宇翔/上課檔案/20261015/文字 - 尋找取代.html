<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const text = '豬排咖哩 雞排咖哩'

    console.log('includes', text.includes('豬排'))

    console.log('indexOf', text.indexOf('咖哩'))

    console.log('replace', text.replaceAll('咖哩', '便當'))

    const email = 'aaaa@gmail.com'
    const regex = /^(?<user>[a-z0-9]+)@(?<domain>[a-z0-9.]+)$/
    const match = email.match(regex)
    console.log('match', match, match.groups.user)

    console.log(email.replace(regex, '帳號是 $<user>'))
  </script>
</body>
</html>
