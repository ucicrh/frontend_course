<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1 id="text"></h1>
  <script>
    const text = document.getElementById('text')

    let number = prompt() * 1

    const countdown = () => {
      text.innerText = `剩餘 ${number} 秒`
      text.style.color = 'blue'
      number--
      if (number < 0) {
        clearInterval(timer)
        text.innerText = `時間到`
        text.style.color = 'red'
      }
    }
    countdown()
    let timer = setInterval(countdown, 1000)
  </script>
</body>
</html>
