<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const bendons = [
      { name: '椒麻雞飯', price: '138' },
      { name: '炸排骨飯', price: '125' },
      { name: '白飯', price: '15' },
    ]

    document.write('<ul>')
    for (let i = 0; i < bendons.length; i++) {
      document.write(`<li>${bendons[i].name}，${bendons[i].price}</li>`)
    }
    document.write('</ul>')

    const nothing = {
      name: 'Nothing',
      url: 'https://tw.nothing.tech/',
      products: [
        { name: 'Phone (1)', price: 13900 },
        { name: 'Phone (2)', price: 21900 },
        { name: 'Phone (3)', price: 29900 },
      ]
    }

    document.write('<table border="1">')
    document.write('<caption>')
    document.write(`<a href="${nothing.url}">${nothing.name}</a>`)
    document.write('</caption>')
    for (let i = 0; i < nothing.products.length; i++) {
      document.write('<tr>')
      document.write(`<td>${nothing.products[i].name}</td>`)
      document.write(`<td>${nothing.products[i].price}</td>`)
      document.write('</tr>')
    }
    document.write('</table>')
  </script>
</body>
</html>
