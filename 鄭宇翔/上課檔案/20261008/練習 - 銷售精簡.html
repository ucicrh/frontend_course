<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // data[][]
    // 第一個 [] 代表銷售員
    // 第二個 [] 代表商品
    const data = [
      [33, 32, 56, 45, 33],
      [77, 33, 68, 45, 23],
      [43, 55, 43, 67, 65]
    ]
    // 商品價格，索引是商品編號
    const prices = [12, 16, 10, 14, 15]

    const totalSales = [0, 0, 0]
    const totalProducts = [0, 0, 0, 0, 0]

    // i = 銷售
    // j = 商品
    for (let i = 0; i < data.length; i++) {
      for (let j = 0; j < data[i].length; j++) {
        // 目前這一格資料的銷售額 = 這一格的資料 * 產品單價
        const total = data[i][j] * prices[j]
        // 對應的銷售額資料
        totalSales[i] += total
        totalProducts[j] += total
      }
    }

    console.log(totalSales)
    console.log(totalProducts)
  </script>
</body>
</html>
