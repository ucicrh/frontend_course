<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    for (let i = 0; i < 10; i++) {
      document.write(i)
    }

    document.write('<hr>')
    
    // 執行 10 次
    for (let i = 1; i <= 10; i++) {
      if (i == 1 || i == 4 || i == 7 || i == 10) {
        document.write(i)
      }
    }

    document.write('<hr>')

    // 執行 4 次
    for (let i = 1; i <= 10; i += 3) {
      document.write(i)
    }
  </script>
</body>
</html>
