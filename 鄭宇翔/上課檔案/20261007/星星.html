<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // document.write('★')
    // document.write('☆')
    // document.write('<br>')

    for (let i = 1; i <= 5; i++) {
      for (let j = 1; j <= i; j++) {
        document.write(`★`)
      }
      document.write('<br>')
    }

    document.write('<hr>')

    // 5
    // i = 1, 4 + 1 = 5
    // i = 2, 3 + 2 = 5
    // 空心 + 實心 = 總層數
    // 實心 = i
    // 空心 = 總層數 - i

    for (let i = 1; i <= 5; i++) {
      for (let j = 1; j <= 5 - i; j++) {
        document.write(`☆`)
      }
      for (let j = 1; j <= i; j++) {
        document.write(`★`)
      }
      document.write('<br>')
    }

    document.write('<hr>')

    for (let i = 1; i <= 5; i++) {
      for (let j = 1; j <= 5 - i; j++) {
        document.write(`☆`)
      }
      for (let j = 1; j <= i * 2 - 1; j++) {
        document.write(`★`)
      }
      for (let j = 1; j <= 5 - i; j++) {
        document.write(`☆`)
      }
      document.write('<br>')
    }
  </script>
</body>
</html>
