<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const Year = Number(prompt('請輸入西元年份'))
        const month = Number(prompt('請輸入月份'))
        const day = Number(prompt('請輸入日期'))
        1
        let totalDay = 0

        if (month > 2 && Year % 4 === 0 && Year % 100 !== 0 || Year % 400 === 0) {
            totalDay += 1
        }


        // switch 可以省略 break，是因為電腦有空降後一路往下衝的瀑布特性；
        // 這讓我們可以方便地把多個條件綁在一起處理，或是進行階層式的連續累加。
        switch (month - 1) {
            case 12: totalDay += 31
            case 11: totalDay += 30
            case 10: totalDay += 31
            case 9: totalDay += 30
            case 8: totalDay += 31
            case 7: totalDay += 31
            case 6: totalDay += 30
            case 5: totalDay += 31
            case 4: totalDay += 30
            case 3: totalDay += 31
            case 2: totalDay += 28
            case 1: totalDay += 31

        }

        for (let i = 1; i <= day; i++) {
            totalDay++;
        }
        document.write(totalDay)
    </script>
</body>

</html>
