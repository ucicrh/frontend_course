<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let year = parseInt(prompt('西元出生'))
        let month = parseInt(prompt('月份'))
        let day = parseInt(prompt('日期'))
        let totalday = 0
        let dyear = (year % 4 === 0 && year % 100 !== 0 || year % 400 === 0)
        for (i = 1; i < month; i++) {
            switch (i) {
                case 1: case 3: case 5: case 7: case 8: case 10: case 12:
                    totalday += 31
                    break
                case 4: case 6: case 9: case 11:
                    totalday += 30
                    break
                case 2:
                    totalday += dyear ? 29 : 28
            }
        }
        totalday += day
        document.write(`你的生日是在${year}年的第${totalday}天`)


    </script>
</body>

</html>
