<!doctype html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>
  <script>
    // 作業

    // 使用者可以輸入西元年、月、日，三個 prompt()
    // 顯示使用者輸入的是該年的第幾天

    // 以 3/5 為例，將前兩個月的天數加起來，再加上 5 天即可
    // 需考慮閏年 +1
    // 某些月份的天數是 30，某些月份的天數是 31
    // parseInt(變數或是數字的文字) 可以把文字轉數字

    const year = parseInt(prompt("輸入西元年"));
    const month = parseInt(prompt("輸入月"));
    const day = parseInt(prompt("輸入日"));

    const m1 = 31;
    const m2 = 28;
    const m3 = 31;
    const m4 = 30;
    const m5 = 31;
    const m6 = 30;
    const m7 = 31;
    const m8 = 31;
    const m9 = 30;
    const m10 = 31;
    const m11 = 30;
    const m12 = 31;

    let totaldays = day;

    for (i = 1; i < month; i++) {
      if (i === 1) {
        totaldays += m1;
      }
      if (i === 2) {
        totaldays += m2;
      }
      if (i === 3) {
        totaldays += m3;
      }
      if (i === 4) {
        totaldays += m4;
      }
      if (i === 5) {
        totaldays += m5;
      }
      if (i === 6) {
        totaldays += m6;
      }
      if (i === 7) {
        totaldays += m7;
      }
      if (i === 8) {
        totaldays += m8;
      }
      if (i === 9) {
        totaldays += m9;
      }
      if (i === 10) {
        totaldays += m10;
      }
      if (i === 11) {
        totaldays += m11;
      }
    }

    if ((year % 400 == 0 || (year % 4 == 0 && year % 100 !== 0)) && month > 2)
      totaldays += 1;

    document.write(`您輸入的是西元${year}年的第${totaldays}天`);
  </script>
</body>

</html>
