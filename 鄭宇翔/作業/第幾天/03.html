<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let year = parseInt(prompt('請輸入西元年'));
    let month = parseInt(prompt('請輸入月份'));
    let day = parseInt(prompt('請輸入日期'));
    let total_day = 0;
    
    for(let i = 1; i <= (month-1); i++){
      if(i === 1 || i === 3 || i === 5 || i === 7 || i === 8 || i === 10 || i === 12){
        total_day += 31;
      }else if(i === 4 || i === 6 || i === 9 || i === 11){
        total_day += 30;
      }else if(i === 2){
        if((!(year%4) && year%100) || !(year%400)){
          total_day += 29;
        }else{
          total_day += 28;
        }
      }
    }

    total_day += day;    

    document.write(`${year} / ${month} / ${day} 是 ${year} 年的第 ${total_day} 天`);
  </script> 
</body>
</html>
