<!DOCTYPE html>
<html lang="zh-Hant">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>04</title>
   <style>
      div {
         width: 100px;
         height: 100px;
         background: rgb(146, 132, 132);
         border: 1px solid black;
      }
   </style>

</head>

<body>
   <div id="color"></div>
   <input type="range" id="red" min="0" max="255" step="1" value="0">
   <span id="r">0</span>
   <input type="button" id="buttonR" value="隨機產生"><br>
   <input type="range" id="green" min="0" max="255" step="1" value="0">
   <span id="g">0</span>
   <input type="button" id="buttonG" value="隨機產生"><br>
   <input type="range" id="blue" min="0" max="255" step="1" value="0">
   <span id="b">0</span>
   <input type="button" id="buttonB" value="隨機產生"><br>


   <script>
      const color = document.getElementById('color')


      const channels = [
         { slider: 'red', label: 'r', button: 'buttonR' },
         { slider: 'green', label: 'g', button: 'buttonG' },
         { slider: 'blue', label: 'b', button: 'buttonB' }
      ].map(({ slider, label, button }) => ({
         slider: document.getElementById(slider),
         label: document.getElementById(label),
         button: document.getElementById(button)
      }))

      const update = () => {
         color.style.background = `rgb(${channels.map(c => c.slider.value).join(', ')})`
         channels.forEach(c => {
            c.label.innerText = c.slider.value
         })
      }

      channels.forEach(c => {
         c.slider.oninput = update
         c.button.onclick = () => {
            c.slider.value = Math.floor(Math.random() * 256)
            update()
         }
      })

      update()
   </script>
</body>

</html>
