<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #show {
            background-color: rgb(243, 213, 213);
            width: 100px;
            height: 100px;
            border: 1px solid #000;
        }
    </style>
</head>

<body>
    <div id="show"></div>
    <input type="range" id="rangeR" min="0" max="255" step="1" value="0">
    <span id="valR">0</span>
    <input type="button" value="隨機" id="R">
    <br>
    <input type="range" id="rangeG" min="0" max="255" step="1" value="0">
    <span id="valG">0</span>
    <input type="button" value="隨機" id="G">
    <br>
    <input type="range" id="rangeB" min="0" max="255" step="1" value="0">
    <span id="valB">0</span>
    <input type="button" value="隨機" id="B">
    <script>
        const R = document.getElementById('R')
        const G = document.getElementById('G')
        const B = document.getElementById('B')

        const valR = document.getElementById('valR')
        const valG = document.getElementById('valG')
        const valB = document.getElementById('valB')

        const rangeR = document.getElementById('rangeR')
        const rangeB = document.getElementById('rangeB')
        const rangeG = document.getElementById('rangeG')

        let r = 0
        let g = 0
        let b = 0

        const show = document.getElementById('show')
        console.log(show)
        show.style.backgroundColor = `rgb(${r},${g},${b})`

        rangeR.onchange = function () {
            r = rangeR.value
            show.style.backgroundColor = `rgb(${r},${g},${b})`
            valR.textContent = `${r}`
        }

        // 隨機
        R.onclick = function () {
            r = Math.round(Math.random() * 255)
            // console.log(r)
            show.style.backgroundColor = `rgb(${r},${g},${b})`
            valR.textContent = `${r}`
            rangeR.value = r
        }
        G.onclick = function () {
            g = Math.round(Math.random() * 255)
            // console.log(g)
            show.style.backgroundColor = `rgb(${r},${g},${b})`
            valG.textContent = `${g}`
            rangeG.value = g

        }
        B.onclick = function () {
            b = Math.round(Math.random() * 255)
            // console.log(b)
            show.style.backgroundColor = `rgb(${r},${g},${b})`
            valB.textContent = `${b}`
            rangeB.value = b
        }


    </script>
</body>

</html>
