<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1px">
        <tr>
            <td>18.2</td>
            <td>17.3</td>
            <td>15.0</td>
            <td>13.4</td>
        </tr>
        <tr>
            <td>23.8</td>
            <td>25.1</td>
            <td>20.6</td>
            <td>17.8</td>
        </tr>
        <tr>
            <td>20.6</td>
            <td>21.5</td>
            <td>18.4</td>
            <td>15.7</td>
        </tr>
    </table>
    <script>

        const data = [
            [18.2, 17.3, 15.0, 13.4],
            [23.8, 25.1, 20.6, 17.8],
            [20.6, 21.5, 18.4, 15.7]
        ]

        let averageTemperature = 0
        for (let i = 1; i < 4; i++) {
            averageTemperature = (data[0][0] + data[1][0] + data[2][0]) / 3
        } document.write(`<p>星期一的平均溫度為${averageTemperature}度</p>`)

        averageTemperature = 0
        for (let i = 1; i < 4; i++) {
            averageTemperature = (data[0][1] + data[1][1] + data[2][1]) / 3
        } document.write(`<p>星期二的平均溫度為${averageTemperature}度</p>`)

        averageTemperature = 0
        for (let i = 1; i < 4; i++) {
            averageTemperature = (data[0][2] + data[1][2] + data[2][2]) / 3
        } document.write(`<p>星期三的平均溫度為${averageTemperature}度</p>`)

        averageTemperature = 0
        for (let i = 1; i < 4; i++) {
            averageTemperature = (data[0][3] + data[1][3] + data[2][3]) / 3
        } document.write(`<p>星期四的平均溫度為${averageTemperature}度</p>`)

        averageTemperature = 0
        for (let i = 1; i < 4; i++) {
            averageTemperature = (data[0][0] + data[0][1] + data[0][2] + data[0][3]) / 4
        } document.write(`<p>時段一的平均溫度為${averageTemperature}度</p>`)

        averageTemperature = 0
        for (let i = 1; i < 4; i++) {
            averageTemperature = (data[1][0] + data[1][1] + data[1][2] + data[1][3]) / 4
        } document.write(`<p>時段二的平均溫度為${averageTemperature}度</p>`)

        averageTemperature = 0
        for (let i = 1; i < 4; i++) {
            averageTemperature = (data[2][0] + data[2][1] + data[2][2] + data[2][3]) / 4
        } document.write(`<p>時段三的平均溫度為${averageTemperature}度</p>`)

        let maximum = data[0][0]
        let maxDay = 0
        let maxTime = 0

        for (let i = 0; i < data.length; i++) {
            for (let j = 0; j < data[i].length; j++) {


                let temp = data[i][j]

                if (temp > maximum) {
                    maximum = temp;
                    maxDay = j + 1
                    maxTime = i + 1
                    console.log(data[i][j])
                }
            }
        }

        document.write(`最高溫為${maximum}度,星期${maxDay},時段${maxTime}<br>`)

        let minimum = data[0][0]
        let miniDay = 0
        let miniTime = 0

        for (let i = 0; i < data.length; i++) {
            for (let j = 0; j < data[i].length; j++) {


                let temp = data[i][j]

                if (temp < minimum) {
                    minimum = temp;
                    miniDay = j + 1
                    miniTime = i + 1
                    console.log(data[i][j])
                }
            }
        }
        document.write(`最低溫為${minimum}度,星期${miniDay},時段${miniTime}`)




    </script>
</body>

</html>
