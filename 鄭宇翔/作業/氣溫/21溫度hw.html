<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const data = [
            [18.2, 17.3, 15.0, 13.4],
            [23.8, 25.1, 20.6, 17.8],
            [20.6, 21.5, 18.4, 15.7]
        ]

        document.write('<table border="1">')
        for (i = 0; i < data.length; i++) {
            document.write('<tr>')
            for (j = 0; j < data[i].length; j++) {
                document.write(`<td>${data[i][j]}</td>`)
            }
            document.write('</tr>')
        }
        document.write('</table>')


        let total = 0
        for (let j = 0; j < data[0].length; j++) {
            let total = 0

            for (let i = 0; i < data.length; i++) {
                total += data[i][j]
            }

            document.write(total / 3 + '<br>')
        }

        for (let a = 0; a < data.length; a++) {
            let total = 0
            for (i = 0; i < data[a].length; i++) {
                total += data[a][i]
            }
            document.write(total / 4 + '<br>')
        }


        let max = data[0][0]

        for (let i = 0; i < data.length; i++) {
            for (let j = 0; j < data[i].length; j++) {
                let temp = data[i][j]
                if (temp > max) {
                    max = temp
                }

            }
        }
        document.write(max)











    </script>
</body>

</html>
