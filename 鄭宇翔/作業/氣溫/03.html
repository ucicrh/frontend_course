<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const data = [
      [18.2, 17.3, 15.0, 13.4],
      [23.8, 25.1, 20.6, 17.8],
      [20.6, 21.5, 18.4, 15.7]
    ]

    document.write(`<table border="1">`);
      for(const date of data){
        document.write(`<tr>`);
          for(const temperature of date){
            document.write(`<td>${temperature}</td>`);
          }         
        document.write(`</tr>`);
      }
    document.write(`</table>`);
    
    document.write(`<hr>`);

    let weeks = [0, 0, 0, 0];

    for(const date of data){
      for(const i in date){
        weeks[i] += (date[i]*1);
      }
    }

    for(const i in weeks){
      document.write(`<span>星期 ${(i*1)+1} 的平溫氣溫是 ${(weeks[i]*1)/data.length} 度</span><br>`);
    }

    document.write(`<hr>`);

    let hotDate = {
      temperature: data[0][0],
      tiem: 1,
      week: 1
    };
    let coldDate = {
      temperature: data[0][0],
      tiem: 1,
      week: 1
    };

    for(const i in data){
      let sum = 0;
      for(const j in data[i]){
        sum += data[i][j];
        if(data[i][j] > hotDate.temperature){
          hotDate.temperature = data[i][j];
          hotDate.tiem = (i*1)+1;
          hotDate.week = (j*1)+1;
        }
        if(data[i][j] < coldDate.temperature){
          coldDate.temperature = data[i][j];
          coldDate.tiem = (i*1)+1;
          coldDate.week = (j*1)+1;
        }
      }
      document.write(`<span>時段 ${(i*1)+1} 的平均氣溫為 ${sum/data[i].length} 度</span><br>`);
    }

    document.write(`<hr>`);

    document.write(`<span>最高溫度為 ${hotDate.temperature} 度，星期 ${hotDate.week}，時段 ${hotDate.tiem}</span><br>`);
    document.write(`<span>最低溫度為 ${coldDate.temperature} 度，星期 ${coldDate.week}，時段 ${coldDate.tiem}</span><br>`);
  </script>
</body>
</html>
