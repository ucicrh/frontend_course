        const rand = (min, max, cnt) => {
            let tmpArr = []
            while (tmpArr.length < cnt) {
                let r = Math.round(Math.random() * (max - min)) + min
                // document.write(`${tmpArr.length} <br>`)
                if (tmpArr.indexOf(r) < 0) {
                    tmpArr.push(r)
                }
            }
            return tmpArr
        }
        let min = 1;
        let max = 38;
        let count = 6;
        document.write('<hr>A 區：')
        document.write(rand(min, max, count))
        document.write('<br><hr>')

        document.write('B 區：')
        max = 8;
        count = 1;
        document.write(rand(min, max, count))
        document.write('<br><hr>')

    </script>
