<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const name = prompt('請輸入姓名');
    const month = prompt('請輸入出生月份');
    const day = prompt('請輸入出生日期');
    let constellation = '';

    if(month > 12 || month < 1 || day > 31 || day < 1){
      constellation = '外星人';
    }else{
      if(month == 1){
        if(day < 20){
          constellation = '摩羯';
        }else{
          constellation = '水瓶';
        }
      }else if(month == 2){
        if(day < 19){
          constellation = '水瓶';
        }else{
          constellation = '雙魚';
        }
      }else if(month == 3){
        if(day < 21){
          constellation = '雙魚';
        }else{
          constellation = '牡羊';
        }
      }else if(month == 4){
        if(day < 20){
          constellation = '牡羊';
        }else{
          constellation = '金牛';
        }
      }else if(month == 5){
        if(day < 21){
          constellation = '金牛';
        }else{
          constellation = '雙子';
        }      
      }else if(month == 6){
        if(day < 21){
          constellation = '雙子';
        }else{
          constellation = '巨蟹';
        }      
      }else if(month == 7){
        if(day < 23){
          constellation = '巨蟹';
        }else{
          constellation = '獅子';
        }      
      }else if(month == 8){
        if(day < 23){
          constellation = '獅子';
        }else{
          constellation = '處女';
        }      
      }else if(month == 9){
        if(day < 23){
          constellation = '處女';
        }else{
          constellation = '天秤';
        }      
      }else if(month == 10){
        if(day < 23){
          constellation = '天秤';
        }else{
          constellation = '天蠍';
        }      
      }else if(month == 11){
        if(day < 22){
          constellation = '天蠍';
        }else{
          constellation = '射手';
        }      
      }else if(month == 12){
        if(day < 22){
          constellation = '射手';
        }else{
          constellation = '摩羯';
        }
      }
    }

    document.write(`${name} 你好，你的星座是 ${constellation}座`);
  </script>
</body>
</html>
